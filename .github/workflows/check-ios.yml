name: Check iOS V0.4.0 Android-style purchase workspace

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/check-ios.yml"
  push:
    branches:
      - "feature/ios-*"
    paths:
      - "ios/**"
      - ".github/workflows/check-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Guard staging-write isolation
        run: python3 ios/scripts/check_readonly.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/TianXianFruit.xcodeproj \
            -scheme TianXianFruit -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests on available iPhone Simulator
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          j=json.load(sys.stdin)
          ids=[d["udid"] for ds in j.get("devices",{}).values()
                for d in ds if d.get("isAvailable",False) and "iPhone" in d.get("name","")]
          print(ids[0] if ids else "")
          ')"
          test -n "$SIM_ID" || { echo "No available iPhone Simulator"; exit 1; }
          xcodebuild -project ios/TianXianFruit.xcodeproj \
            -scheme TianXianFruit -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO test
