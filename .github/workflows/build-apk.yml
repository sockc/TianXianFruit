name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "同时发布 GitHub Release"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Cannot read versionName/versionCode from app/build.gradle"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          APK_NAME="TianXianFruit-${TAG}.apk"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TianXianFruit-${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "Release tag: $TAG"

      - name: Validate pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED="${{ steps.version.outputs.tag }}"
          ACTUAL="${GITHUB_REF_NAME}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Tag mismatch."
            echo "app/build.gradle requires: $EXPECTED"
            echo "but pushed tag is: $ACTUAL"
            exit 1
          fi

      - name: Create release tag for manual publish
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists on another commit."
              echo "Existing: $TAG_SHA"
              echo "Current:  $GITHUB_SHA"
              exit 1
            fi

            echo "Tag $TAG already exists on the current commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "Missing SIGNING_KEY_BASE64 secret"
            exit 1
          fi

          echo "$SIGNING_KEY_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/tianxian-release.jks"

      - name: Build signed Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/tianxian-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            "${{ steps.version.outputs.apk_name }}"

      - name: Verify signed APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "${{ steps.version.outputs.apk_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' &&
          inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 天鲜账本 V${{ steps.version.outputs.version_name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
