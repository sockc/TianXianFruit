name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "同时发布 GitHub Release"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Cannot read versionName/versionCode from app/build.gradle"
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          APK_NAME="TianXianFruit-${TAG}.apk"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TianXianFruit-${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "Release tag: $TAG"

      - name: Validate pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED="${{ steps.version.outputs.tag }}"
          ACTUAL="${GITHUB_REF_NAME}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Tag mismatch."
            echo "app/build.gradle requires: $EXPECTED"
            echo "but pushed tag is: $ACTUAL"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "Missing SIGNING_KEY_BASE64 secret"
            exit 1
          fi

          echo "$SIGNING_KEY_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/tianxian-release.jks"

      - name: Build signed Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/tianxian-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            "${{ steps.version.outputs.apk_name }}"

      - name: Verify signed APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "${{ steps.version.outputs.apk_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error

      # IMPORTANT: tag/release handling is intentionally AFTER a successful APK build.
      # A failed Kotlin/Gradle build must never reserve the version tag.
      - name: Prepare release tag after successful build
        id: release_tag
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          CAN_PUBLISH="true"
          git fetch --tags --force

          # A tag-push workflow is already pinned to the correct version tag.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag-triggered build: $GITHUB_REF_NAME"
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_EXISTS="false"
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              if [ "$RELEASE_EXISTS" = "true" ]; then
                # A real published release already owns this version. Do not silently
                # move its tag: publishing new code requires a new version number.
                CAN_PUBLISH="false"
                echo "::warning::Release $TAG already exists on commit $TAG_SHA."
                echo "::warning::Current commit is $GITHUB_SHA. Increase versionName/versionCode for another published update."
              else
                # Typical recovery case: an older workflow created the tag BEFORE
                # compilation, compilation failed, and therefore no Release exists.
                # It is safe to repair that stale/unpublished tag now that this build
                # has completed successfully.
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag -f "$TAG" "$GITHUB_SHA"
                git push --force origin "refs/tags/$TAG"
                echo "Repaired stale unpublished tag $TAG: $TAG_SHA -> $GITHUB_SHA"
              fi
            else
              echo "Tag $TAG already points to the successful build commit."
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "Created release tag $TAG after successful build."
          fi

          echo "can_publish=$CAN_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release and upload APK
        if: >-
          steps.release_tag.outputs.can_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.version.outputs.apk_name }}"
          TITLE="天鲜账本 V${{ steps.version.outputs.version_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --draft=false \
              --prerelease=false

            gh release upload "$TAG" "$APK" --clobber
            echo "Updated Release $TAG and replaced APK asset."
          else
            gh release create "$TAG" "$APK" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
            echo "Created Release $TAG and uploaded APK."
          fi

          {
            echo "### GitHub Release published"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- APK: \`$APK\`"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
