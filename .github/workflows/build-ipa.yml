name: Build signed iOS Ad Hoc IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require private repository for family IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true" || {
            echo "::error::This repository is public. Build signed IPA in a private repository."
            exit 1
          }
      - name: Verify all signing secrets present
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for key in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROFILE_BASE64 IOS_TEAM_ID IOS_KEYCHAIN_PASSWORD; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
      - name: Check read-only mode and prepare Xcode
        run: |
          python3 ios/scripts/check_readonly.py
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Install temporary signing identity
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" \
            -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, plistlib, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with (root/"profile.plist").open("rb") as f: p=plistlib.load(f)
          assert p.get("ProvisionedDevices"), "Not an Ad Hoc device profile"
          app=p["Entitlements"]["application-identifier"].split(".",1)[1]
          assert app == "com.tianxian.fruit.ios", "Profile Bundle ID mismatch"
          name=p["Name"]
          output=root/"profile-name.txt"
          output.write_text(name, encoding="utf-8")
          target=pathlib.Path.home()/"Library/MobileDevice/Provisioning Profiles"
          target.mkdir(parents=True, exist_ok=True)
          (target/(p["UUID"]+".mobileprovision")).write_bytes(
              (root/"distribution.mobileprovision").read_bytes())
          PY
      - name: Archive and export signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          PROFILE_NAME="$(cat "$RUNNER_TEMP/profile-name.txt")"
          xcodebuild archive \
            -project ios/TianXianFruit.xcodeproj \
            -scheme TianXianFruit -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TianXianFruit.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          python3 - <<'PY'
          import os, plistlib, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"ExportOptions.plist"
          profile=(p.parent/"profile-name.txt").read_text().strip()
          options={"method":"ad-hoc","signingStyle":"manual",
                   "teamID":os.environ["IOS_TEAM_ID"],
                   "signingCertificate":"Apple Distribution",
                   "provisioningProfiles":{"com.tianxian.fruit.ios":profile}}
          with p.open("wb") as f: plistlib.dump(options,f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TianXianFruit.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -f "$RUNNER_TEMP/ipa/TianXianFruit.ipa"
      - name: Upload private signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianXianFruit-iOS-v0.2.5-AdHoc
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
