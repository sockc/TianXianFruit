name: Check Android app

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/check-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: SQLite sync regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Unit tests, lint and debug build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
