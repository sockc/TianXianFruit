name: Publish verified Build 79 test IPA
on:
  push:
    branches: [release/ios-v1.0.2-build79]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-ios-build79
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sockc/TianXianFruit' && github.ref == 'refs/heads/release/ios-v1.0.2-build79'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sockc/TianXianFruit
      TARGET: 672523888640ca8521081e847ef243ef877617e4
      RUN: "45680801735"
      ARTIFACT: "15053709356"
      DIGEST: sha256:d6673c2786d9307c7a8c5ced7050fcd212d4607077074bc8011539600c6f9312
      TAG: ios-v1.0.2-build79
      IPA: TianXianFruit-iOS-v1.0.2-Build79-TrollStore.ipa
    steps:
      - name: Verify source and exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          for id in "$RUN" 45680801574 45680819182; do
            gh api "repos/$GH_REPO/actions/runs/$id" > run.json
            jq -e --arg target "$TARGET" '.head_sha == $target and .status == "completed" and .conclusion == "success"' run.json >/dev/null
          done
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT" > artifact.json
          jq -e --arg target "$TARGET" --arg digest "$DIGEST" --argjson run "$RUN" '.workflow_run.head_sha == $target and .workflow_run.id == $run and .digest == $digest and .expired == false and .name == "TianXianFruit-iOS-v1.0.2-Build79-TrollStore"' artifact.json >/dev/null
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "v1.4.7.135"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Refusing to overwrite existing release"; exit 1; fi
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "Refusing to reuse existing tag"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: "15053709356"
          run-id: "45680801735"
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Validate IPA and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s "$IPA"
          python3 - <<'PY'
          import os,plistlib,zipfile
          with zipfile.ZipFile(os.environ["IPA"]) as z:
              assert z.testzip() is None
              paths=[p for p in z.namelist() if p.startswith("Payload/") and p.count("/")==2 and p.endswith(".app/Info.plist")]
              assert len(paths)==1, paths
              d=plistlib.loads(z.read(paths[0]))
              assert d["CFBundleIdentifier"]=="com.tianxian.fruit.ios"
              assert d["CFBundleShortVersionString"]=="1.0.2"
              assert d["CFBundleVersion"]=="79"
              assert d["MinimumOSVersion"]=="15.0"
              assert paths[0].rsplit("/",1)[0]+"/"+d["CFBundleExecutable"] in z.namelist()
          PY
          sha256sum "$IPA" > SHA256SUMS.txt
      - name: Publish public prerelease without changing Android Latest
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## iOS V1.0.2 Build 79 · 营业 V2 测试版
          
          - 凌晨收款按自然日和收款人同步，支持逐渠道扣减及本次凌晨录入。
          - 测试账本支持费用付款人、V2 原子联合提交、不可变请求保留及双流回读。
          - 已通过 iOS 编译、XCTest、IPA 构建；Server V1.0.37 RC2 隔离 PostgreSQL/HTTP 验证及实际部署由用户确认成功。
          - 仅 V2 测试账本准入，正式账本继续使用原有接口；Android V1.4.7.135 不变。
          - 尚需安卓与 iOS 实机跨设备验收。账单补录营业未纳入此版。
          - 最低 iOS 15.0，TrollStore 安装。沿用通过 CI 的原 IPA，不重新构建。
          EOF
          gh release create "$TAG" "dist/$IPA" dist/SHA256SUMS.txt --target "$TARGET" --title "iOS V1.0.2 Build 79 · 营业 V2 测试版" --notes-file notes.md --prerelease --latest=false
          gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{tag_name,prerelease,draft,assets:[.assets[]|{name,state,digest}]}'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "v1.4.7.135"
