name: Check server tools

on:
  push:
    paths:
      - "server-tools/backup-manager/**"
      - "server-tools/txb-web/**"
      - ".github/workflows/check-server-tools.yml"
  pull_request:
    paths:
      - "server-tools/backup-manager/**"
      - "server-tools/txb-web/**"
      - ".github/workflows/check-server-tools.yml"

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check TianXian manager syntax
        run: bash -n server-tools/backup-manager/tianxian-manager
      - name: Check TianXian recover syntax
        run: bash -n server-tools/backup-manager/tianxian-recover
      - name: Check Web TXB tools syntax
        run: |
          bash -n server-tools/txb-web/tianxian-backup
          bash -n server-tools/txb-web/tianxian-restore
          bash -n server-tools/txb-web/install.sh
          bash -n server-tools/txb-web/tests/smoke.sh

  txb-web-smoke:
    runs-on: ubuntu-latest
    needs: bash-syntax
    steps:
      - uses: actions/checkout@v4
      - name: Run Web TXB backup and restore smoke test
        run: bash server-tools/txb-web/tests/smoke.sh
