name: V1.4.7.130 Preview APK

on:
  push:
    branches:
      - fix/v1.4.7.130-audit-foundation
    paths:
      - .github/workflows/v147130-preview-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    name: Build side-by-side test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4

      - name: Install SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare isolated preview identity (only in CI workspace)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle")
          content = gradle.read_text(encoding="utf-8")
          assert 'versionCode 167' in content
          assert 'versionName "1.4.7.129"' in content
          assert "    buildTypes {\n        release {" in content
          content = content.replace('versionCode 167', 'versionCode 168', 1)
          content = content.replace('versionName "1.4.7.129"', 'versionName "1.4.7.130-preview"', 1)
          content = content.replace(
              "    buildTypes {\n        release {",
              "    buildTypes {\n        debug {\n            applicationIdSuffix '.preview'\n        }\n        release {",
              1,
          )
          gradle.write_text(content, encoding="utf-8")
          strings = Path("app/src/main/res/values/strings.xml")
          label = strings.read_text(encoding="utf-8")
          assert '<string name="app_name">天鲜账本</string>' in label
          strings.write_text(label.replace(
              '<string name="app_name">天鲜账本</string>',
              '<string name="app_name">天鲜账本·测试版</string>',
              1), encoding="utf-8")
          print("Preview applicationId=com.tianxian.fruit.preview")
          print("Preview version=1.4.7.130-preview (168)")
          PY

      - name: Build installable debug-signed APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify isolated package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/TianXianFruit-V1.4.7.130-preview-test.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging dist/TianXianFruit-V1.4.7.130-preview-test.apk \
             | tee dist/apk-package-info.txt
          grep -q "name='com.tianxian.fruit.preview'" dist/apk-package-info.txt
          grep -q "versionCode='168'" dist/apk-package-info.txt
          (cd dist && sha256sum TianXianFruit-V1.4.7.130-preview-test.apk > SHA256SUMS.txt)
          echo "### V1.4.7.130 Preview APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Installs alongside the production app under \`com.tianxian.fruit.preview\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Debug-signed for test-account verification only. Not an official release." >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TianXianFruit-V1.4.7.130-Preview-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
